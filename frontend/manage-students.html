<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students</title>

    <!-- Prevent favicon error -->
    <link rel="icon" href="data:,">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/manage-students.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
        }

        form {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            width: 320px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input, select, button {
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .camera-box {
            position: relative;
            margin-top: 10px;
        }

        video {
            width: 100%;
            border: 2px solid #007bff;
            border-radius: 10px;
        }

        canvas {
            position: absolute;
            left: -9999px;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 80%;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ccc;
        }

        th {
            background: #007bff;
            color: white;
        }
    </style>
</head>

<body>

    <h2>Manage Students</h2>

    <form id="addStudentForm">

        <input type="text" id="studentName" name="name" placeholder="Student Name" required>

        <input type="text" id="rollNo" name="rollNo" placeholder="Roll Number" required>

        <select id="studentClass" name="class" required>
            <option value="">-- Select Class --</option>
        </select>

        <div class="camera-box">

            <video
                id="video"
                autoplay
                muted
                playsinline
            >
                Your browser does not support camera.
            </video>

            <button type="button" id="captureBtn">
                Capture Face
            </button>

            <canvas id="canvas"></canvas>

        </div>

        <input type="hidden" id="faceImage" name="faceImage">

        <button type="submit">Add Student</button>

    </form>

    <h3>Student List</h3>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Roll No</th>
                <th>Class</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="studentTable"></tbody>
    </table>

    <!-- Face API (MUST load first) -->
    <script src="./js/face-api.min.js" defer></script>

    <!-- Your JS -->
    <script src="./js/manage-students.js" defer></script>

</body>
</html>
